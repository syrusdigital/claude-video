<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Overlay — price shock</title>
<style>html,body{margin:0;background:repeating-conic-gradient(#ccc 0 25%,#eee 0 50%) 0 0/40px 40px}canvas{height:100vh;display:block;margin:0 auto}</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script src="../_lib/overlay.js"></script>
<script>
// =====================================================================
//  OVERLAY: price shock — "WHY PAY $40,000 / $50,000 / $60,000…" stack in red, each struck through on the
//  VO beat, they fall away, and "STARTING AT JUST $17,995" lands in gold. 4.5s @ 30fps, centre frame.
//  Edit CONFIG only. Beats (seconds) let the editor line it up with the voiceover.
// =====================================================================
const CONFIG = {
  lead: 'WHY PAY',
  anchors: ['$40,000', '$50,000', 'OR EVEN $60,000?'],
  reveal: 'STARTING AT JUST',
  price: '$17,995',
  beats: { anchors: [0.15, 0.6, 1.05], strike: 1.6, drop: 2.2, reveal: 2.5 },
  brand: {},
};
const FPS = 30, DUR = 4.5;
function renderFrame(t) {
  frameStart();
  const B = CONFIG.beats, cx = W / 2;
  const fade = 1 - easeOut((t - (DUR - 0.3)) / 0.3);
  ctx.globalAlpha = fade;
  // the lead line
  const la = spring(t - 0.0, 220, 22);
  if (t < B.drop + 0.4) text(CONFIG.lead, cx, 640 - (1 - la) * 30, 64, '#ffffff', { align: 'center', alpha: clamp(la) * (1 - easeIn((t - B.drop) / 0.35)), spacing: 4 });
  // the anchors: pop in on their beats, struck through together, then fall away with a little spin
  CONFIG.anchors.forEach((s, i) => {
    const a = spring(t - B.anchors[i], 260, 18);
    if (a <= 0.001) return;
    const fall = easeIn((t - B.drop - i * 0.05) / 0.45), y = 780 + i * 150 + fall * 700, rot = fall * (i % 2 ? -0.25 : 0.2);
    const sz = i === CONFIG.anchors.length - 1 ? 104 : 120, sc = 0.6 + 0.4 * a;
    ctx.save(); ctx.translate(cx, y); ctx.rotate(rot); ctx.scale(sc, sc); ctx.globalAlpha = fade * clamp(a) * (1 - fall);
    const w = text(s, 0, 0, sz, BRAND.bad, { align: 'center', font: SERIF, italic: true, weight: 700 });
    const k = easeOut((t - B.strike - i * 0.08) / 0.18);   // the strike-through draws left to right
    if (k > 0) { ctx.fillStyle = '#ffffff'; ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 10; ctx.fillRect(-w / 2 - 12, -sz * 0.32, (w + 24) * k, 10); }
    ctx.restore();
  });
  // the reveal: kicker, then the price slams in (scale from big to 1 on a stiff spring) with a gold underline
  const r = spring(t - B.reveal, 180, 20), p = spring(t - B.reveal - 0.25, 320, 17);
  if (r > 0.001) text(CONFIG.reveal, cx, 860 - (1 - r) * 30, 58, '#ffffff', { align: 'center', alpha: fade * clamp(r), spacing: 4 });
  if (p > 0.001) {
    ctx.save(); ctx.translate(cx, 1040); const s = 1 + (1 - clamp(p)) * 0.8 + (p - clamp(p)) * 0.4; ctx.scale(s, s); ctx.globalAlpha = fade * clamp(p * 2);
    const w = text(CONFIG.price, 0, 0, 190, BRAND.accent, { align: 'center', font: SERIF, weight: 700, blur: 26 });
    ctx.restore();
    const u = easeOut((t - B.reveal - 0.55) / 0.35) * w;
    if (u > 1) { ctx.save(); ctx.globalAlpha = fade; rrect(cx - w / 2, 1080, u, 14, 7); ctx.fillStyle = BRAND.accent; ctx.shadowColor = 'rgba(0,0,0,0.4)'; ctx.shadowBlur = 12; ctx.fill(); ctx.restore(); }
  }
}
boot(renderFrame, FPS, DUR);
</script></body></html>
