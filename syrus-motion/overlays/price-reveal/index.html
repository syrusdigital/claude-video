<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Overlay — price reveal</title>
<style>
  html, body { margin: 0; background: repeating-conic-gradient(#ccc 0 25%, #eee 0 50%) 0 0 / 40px 40px; }
  canvas { height: 100vh; display: block; margin: 0 auto; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
"use strict";
// =====================================================================
//  OVERLAY: price reveal (lower third, transparent). Drop on any B-roll; 3.0s @ 30fps.
//  A card springs up, the price rolls up like an odometer and lands; a gold underline wipes under it.
//  Edit the CONFIG block to make a variant; nothing else needs touching.
// =====================================================================
const CONFIG = {
  kicker: 'FULL BATHROOM REMODEL',
  pre: 'starting at',
  price: 14995,
  note: '',                       // e.g. a short disclaimer line; keep empty for none
  accent: '#FFD700', card: '#002F6C', ink: '#F8F8F4', sky: '#66C2FF',
};
const W = 1080, H = 1920, FPS = 30, DUR = 3.0;
window.OVERLAY = { width: W, height: H, fps: FPS, frames: Math.round(DUR * FPS) };
const SANS = '"Geist", "Inter", "Helvetica Neue", Arial, sans-serif';
const ctx = document.getElementById('c').getContext('2d');
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
// closed-form spring 0 -> 1 (deterministic: any frame renders alone)
function spring(t, k = 170, d = 20) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k), z = d / (2 * w0), wd = w0 * Math.sqrt(1 - z * z);
  return 1 - Math.exp(-z * w0 * t) * (Math.cos(wd * t) + (z * w0 / wd) * Math.sin(wd * t));
}
const easeOut = (u) => 1 - Math.pow(1 - clamp(u), 3);
function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
const money = (n) => '$' + Math.round(n).toLocaleString('en-US');

function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, W, H);   // transparent every frame
  const outT = DUR - 0.35, out = easeOut((t - outT) / 0.35);       // the card leaves at the end so it can be cut anywhere
  const up = spring(t - 0.05, 190, 19) * (1 - out);
  if (up <= 0.001) return;
  const cw = 860, ch = 330, cx = (W - cw) / 2, cy = 1110 + (1 - up) * 140;
  ctx.save(); ctx.globalAlpha = clamp(up * 1.4);
  // the card: navy, a soft drop shadow so it holds on busy footage
  ctx.shadowColor = 'rgba(0,10,30,0.45)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14;
  rrect(cx, cy, cw, ch, 34); ctx.fillStyle = CONFIG.card; ctx.fill();
  ctx.shadowColor = 'transparent';
  // the kicker: sky, letter-spaced, types on
  const k = CONFIG.kicker, kn = Math.floor(clamp((t - 0.25) / 0.45) * k.length);
  ctx.font = `700 34px ${SANS}`; ctx.fillStyle = CONFIG.sky; ctx.textBaseline = 'alphabetic';
  ctx.letterSpacing = '6px'; ctx.fillText(k.slice(0, kn), cx + 56, cy + 78); ctx.letterSpacing = '0px';
  ctx.font = `500 36px ${SANS}`; ctx.fillStyle = CONFIG.ink; ctx.globalAlpha = clamp(up * 1.4) * clamp((t - 0.45) / 0.25);
  ctx.fillText(CONFIG.pre, cx + 56, cy + 138);
  ctx.globalAlpha = clamp(up * 1.4);
  // the price: rolls up and lands on a spring (a tiny overshoot), then the gold underline wipes in
  const roll = easeOut((t - 0.55) / 0.9), land = spring(t - 1.4, 300, 18);
  const val = CONFIG.price * roll, sc = 1 + (land < 1 ? 0 : 0) + 0.06 * Math.sin(Math.min(1, Math.max(0, t - 1.4) / 0.25) * Math.PI);
  ctx.save(); ctx.translate(cx + 56, cy + 262); ctx.scale(sc, sc);
  ctx.font = `900 132px ${SANS}`; ctx.fillStyle = CONFIG.ink; ctx.fillText(money(val), 0, 0);
  const pw = ctx.measureText(money(CONFIG.price)).width;
  ctx.restore();
  const uw = pw * easeOut((t - 1.45) / 0.4);
  if (uw > 1) { rrect(cx + 56, cy + 282, uw, 16, 8); ctx.fillStyle = CONFIG.accent; ctx.fill(); }
  if (CONFIG.note) { ctx.font = `400 26px ${SANS}`; ctx.fillStyle = CONFIG.sky; ctx.fillText(CONFIG.note, cx + 56, cy + ch + 46); }
  ctx.restore();
}
window.renderFrame = renderFrame;
if (!location.search.includes('export')) { const s = performance.now(); const tick = () => { renderFrame(((performance.now() - s) / 1000) % (DUR + 0.6)); requestAnimationFrame(tick); }; tick(); }
</script>
</body>
</html>
